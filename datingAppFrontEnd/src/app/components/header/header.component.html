<div class="mobile-topbar d-lg-none">
  <button class="topbar-toggle" type="button" (click)="toggleSidebar()" [attr.aria-expanded]="isOpen()" aria-label="Toggle navigation">
    <i class="bi" [class.bi-list]="!isOpen()" [class.bi-x-lg]="isOpen()"></i>
  </button>
  <a class="topbar-brand" [routerLink]="isAuthenticated() ? '/dashboard' : '/'">
    <i class="bi bi-heart-fill"></i> LoveFox
  </a>
</div>

<div class="sidebar-backdrop d-lg-none" *ngIf="isOpen()" (click)="closeSidebar()"></div>

<aside class="sidebar" [class.open]="isOpen()">
  <a class="sidebar-brand" [routerLink]="isAuthenticated() ? '/dashboard' : '/'">
    <i class="bi bi-heart-fill"></i> LoveFox
  </a>

  <nav class="sidebar-nav">
    <a class="sidebar-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" *ngIf="!isAuthenticated()">
      <i class="bi bi-house-door-fill"></i><span>Home</span>
    </a>
    <a class="sidebar-link" routerLink="/dashboard" routerLinkActive="active" *ngIf="isAuthenticated()">
      <i class="bi bi-grid-fill"></i><span>Dashboard</span>
    </a>
    <a class="sidebar-link" routerLink="/messages" routerLinkActive="active" *ngIf="isAuthenticated()">
      <i class="bi bi-chat-heart-fill"></i><span>Messages</span>
      <span class="badge bg-danger rounded-pill ms-auto" *ngIf="unreadCount() > 0">{{ unreadCount() }}</span>
    </a>
    <a class="sidebar-link" routerLink="/service" routerLinkActive="active">
      <i class="bi bi-stars"></i><span>Services</span>
    </a>
    <a class="sidebar-link" routerLink="/blog" routerLinkActive="active">
      <i class="bi bi-journal-richtext"></i><span>Blog</span>
    </a>
    <a class="sidebar-link" routerLink="/privacy" routerLinkActive="active">
      <i class="bi bi-shield-lock-fill"></i><span>Privacy</span>
    </a>
    <a class="sidebar-link" routerLink="/contact" routerLinkActive="active">
      <i class="bi bi-envelope-fill"></i><span>Contact</span>
    </a>

    <ng-container *ngIf="isAuthenticated()">
      <div class="sidebar-divider"></div>

      <div class="dropdown theme-picker">
        <button class="sidebar-link theme-picker-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
          <i class="bi bi-palette-fill"></i><span>Theme Color</span>
          <span class="theme-swatch-current ms-auto"></span>
          <i class="bi bi-chevron-down theme-picker-caret"></i>
        </button>
        <div class="dropdown-menu theme-swatch-menu p-3">
          <p class="theme-swatch-heading">Choose a theme color</p>
          <div class="theme-swatch-grid">
            <button
              *ngFor="let palette of accentPalettes"
              type="button"
              class="theme-swatch-option"
              [class.selected]="palette.id === currentAccentId()"
              [style.--swatch-color]="palette.accent"
              [title]="palette.label"
              (click)="setAccent(palette.id)"
            >
              <span class="theme-swatch-circle">
                <i class="bi bi-check-lg" *ngIf="palette.id === currentAccentId()"></i>
              </span>
              <span class="theme-swatch-label">{{ palette.label }}</span>
            </button>
          </div>
        </div>
      </div>

      <a class="sidebar-link" routerLink="/profile" routerLinkActive="active">
        <i class="bi bi-person-circle"></i><span>My Profile</span>
      </a>
      <a class="sidebar-link" routerLink="/likes" routerLinkActive="active">
        <i class="bi bi-heart-fill"></i><span>Who Liked Me</span>
      </a>
      <a class="sidebar-link premium-link" routerLink="/premium" routerLinkActive="active">
        <i class="bi bi-gem"></i><span>Premium</span>
      </a>
      <a class="sidebar-link" routerLink="/safety" routerLinkActive="active">
        <i class="bi bi-shield-check"></i><span>Safety</span>
      </a>
      <a class="sidebar-link" routerLink="/verification" routerLinkActive="active">
        <i class="bi bi-patch-check-fill"></i><span>Get Verified</span>
      </a>
      <a class="sidebar-link" routerLink="/admin" routerLinkActive="active" *ngIf="currentUser()?.role === 'ADMIN'">
        <i class="bi bi-speedometer2"></i><span>Admin</span>
      </a>
    </ng-container>
  </nav>

  <div class="sidebar-footer">
    <button class="btn btn-danger w-100" routerLink="/login" *ngIf="!isAuthenticated()">Sign in</button>

    <div class="sidebar-user" *ngIf="isAuthenticated()">
      <div class="d-flex align-items-center justify-content-between mb-2">
        <span class="sidebar-user-name">Hi, {{ currentUser()?.firstName }}</span>
        <span class="badge bg-warning text-dark" *ngIf="isPremium()">{{ subscriptionTier() }}</span>
      </div>
      <button class="btn btn-outline-danger btn-sm w-100" (click)="logout()">Logout</button>
    </div>
  </div>
</aside>
